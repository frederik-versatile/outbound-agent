# Render blueprint for one customer deployment of the outbound agent.
# Deploy: connect this repo in the Render dashboard -> "New Blueprint" ->
# it reads this file and creates all three services below in one go.
#
# Scoped to a single deployment_id (see README "Scope" — this project is
# built for one client right now). To onboard a second client, duplicate
# the three cron services and the dashboard web service below with a
# different --deployment/DEPLOYMENT_ID value and new service names; the
# keyvalue store and its REDIS_URL wiring can be shared across deployments
# since every key is already namespaced by deployment_id (see store.py /
# deployment.py's secret_key/state_key).
#
# BEFORE DEPLOYING: replace "acme-corp" below with your real deployment_id,
# matching a file at config/deployments/<deployment_id>.yaml.
#
# ipAllowList: [] restricts the keyvalue instance to internal Render traffic
# only (no public internet access) — verify this still reads as "internal
# only, no external access needed" in the Render dashboard when you set it
# up, since exact defaults can change.
#
# plan is deliberately NOT "free": Render's own docs say free Key Value
# instances aren't durable ("a restart, maintenance event, or upgrade can
# result in data loss... not appropriate as a durable production
# datastore"). That's exactly the OAuth tokens and drafts state this store
# exists to protect, so this pays for the smallest persistent tier
# (256mb, ~$10/mo at time of writing — verify current price in the Render
# dashboard) rather than risk silently losing a customer's Gmail/Outlook
# token on a routine restart.

services:
  - type: keyvalue
    name: outbound-agent-kv
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction   # durable state (OAuth tokens, audit trail), not a cache — never evict
    persistenceMode: journal-snapshot

  - type: cron
    name: outbound-agent-pipeline
    runtime: python
    schedule: "0 13 * * *"   # daily, 13:00 UTC — adjust to your timezone/preference
    buildCommand: pip install -r requirements.txt
    startCommand: python orchestrator.py run --deployment acme-corp
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: outbound-agent-kv
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the Render dashboard, not committed to the repo
      - key: APOLLO_API_KEY_ACME_CORP
        sync: false
      - key: STRIPE_API_KEY
        sync: false

  - type: cron
    name: outbound-agent-poller
    runtime: python
    schedule: "0 */4 * * *"   # every 4 hours
    buildCommand: pip install -r requirements.txt
    startCommand: python poll_for_edits.py --deployment acme-corp
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: outbound-agent-kv
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false

  # Advances leads through the multi-step sequence (config/sequences/<id>.yaml):
  # reply detection, drafting follow-up/breakup steps, starting/clearing the
  # recycle cooldown. Runs after outbound-agent-poller in practice (reply-check
  # timers are multi-day, so exact ordering within a day doesn't matter) but
  # depends on it logically: a step-0 draft only starts its reply-check timer
  # once the poller confirms it was actually sent.
  - type: cron
    name: outbound-agent-sequencer
    runtime: python
    schedule: "30 */4 * * *"   # every 4 hours, offset from the poller
    buildCommand: pip install -r requirements.txt
    startCommand: python advance_sequences.py --deployment acme-corp
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: outbound-agent-kv
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false

  # Read-only dashboard: sends, replies, reply rate, who was emailed — see
  # dashboard.py. Free plan is fine for a low-traffic internal tool (spins
  # down after 15 min idle, ~1 min cold start on the next visit — see
  # README "Dashboard" for the tradeoff). Needs no Anthropic/Apollo/Stripe
  # access at all, only REDIS_URL to read the same state the cron jobs
  # write, and its own basic-auth credentials.
  - type: web
    name: outbound-agent-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard:app --bind 0.0.0.0:$PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: outbound-agent-kv
          property: connectionString
      - key: DEPLOYMENT_ID
        value: acme-corp
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
