# Copy this file to Agents/Clients/<Client>/outbound/outbound.yaml to onboard a new customer
# (see README). deployment_id is passed on the command line as --deployment <deployment_id> and
# must be registered on the client with new_client.py --outbound <deployment_id>.

deployment_id: example

mail_provider: gmail  # gmail | outlook

# OAuth tokens (gmail_client_secret.json + gmail_token.json, or
# outlook_token.json) live in deployment.store — see store.py — written by
# setup_oauth_gmail.py / setup_oauth_outlook.py, never in this file.
# client_id/tenant_id below are not secret, just Outlook's app registration.
outlook:
  client_id: ""
  tenant_id: ""

# Gates every scheduled run (orchestrator.py and poll_for_edits.py) on this
# customer's Stripe subscription being active/trialing — see billing.py.
# Leave stripe_subscription_id empty and every run refuses to start.
billing:
  stripe_subscription_id: ""

# Apollo key: stored per client in the macOS Keychain by setup_apollo.py. This env var name is only
# used where there is no Keychain (cloud deploys).
apollo_api_key_env: APOLLO_API_KEY_EXAMPLE

# Names that sign this customer's emails. Replaced with {{sender_name}} before the learning stage
# sees a human edit (no-PII rule).
sender_names: []

# Optional: cross-references Apollo-sourced accounts against a customer's
# own tracked buying-signal sheet (e.g. "companies currently hiring a
# videographer"). NEVER the primary source of accounts — prioritization
# still runs Apollo search from the ICP doc; a hire-sheet match only boosts
# an already-scored account's score and appends a rationale note. Leave
# enabled: false (or omit this whole section) to skip it entirely.
# Requires setup_google_sheets.py and sharing the sheet with the service
# account it creates.
hire_sheet:
  enabled: false
  spreadsheet_id: ""
  range: "Sheet1!A2:B"    # company name in column A, domain in column B
  name_column: 0
  domain_column: 1
  score_boost: 15

# Docs this deployment reads from.
icp_doc: icp.md
positioning_doc: positioning.md

# Target buyer titles/seniorities the discovery stage searches for, in addition
# to whatever the ICP doc itself specifies.
target_titles:
  - "VP Sales"
  - "Head of Sales"
  - "Director of Revenue Operations"
target_seniorities:
  - "vp"
  - "director"
  - "head"

# Model per stage. Prioritization is judgment-heavy (worth a stronger model);
# discovery and learning are narrower, more mechanical tasks.
models:
  prioritization: claude-opus-4-6
  discovery: claude-sonnet-5
  drafting: claude-sonnet-5
  learning: claude-sonnet-5

safety:
  dry_run_default: true          # every run is a dry run until a human flips this per deployment
  max_accounts_per_run: 25
  max_contacts_per_account: 2
  max_total_enrich_calls_per_run: 50   # Apollo enrichment is metered — real money per call
  max_drafts_per_run: 25

# Learning loop tuning (used by poll_for_edits.py / learning_agent).
learning:
  enable_stable_draft_signal: false   # see plan: off by default, half-finished edits teach the wrong lesson
  stable_draft_settle_hours: 6
  style_notes_token_budget: 4000      # trigger a consolidation pass above this size
